model:
  backbone: resnet50
  pretrained_backbone: true
  input_size: 640
  neck_channels:
    - 128
    - 256
    - 512
  fpn_depth: 2

training:
  epochs: 50
  batch_size: 8
  num_workers: 4
  lr: 0.0005
  backbone_lr: 0.0001
  layer3_lr: 0.00002
  weight_decay: 0.0005

  scheduler: cosine
  warmup_epochs: 3
  warmup_start_factor: 0.1
  min_lr: 0.00001
  min_backbone_lr: 0.000001
  min_layer3_lr: 0.000001

  layer4_unfreeze_epoch: 4
  layer3_unfreeze_epoch: 11

  val_interval: 3
  val_every_epoch_from: 0
  early_stopping_patience: 15

  ema:
    enabled: true
    decay: 0.9999
    tau: 2000

inference:
  confidence: 0.001
  iou: 0.55

loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5

augmentation:
  flip_lr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.10
  scale: 0.20
